name: Public market scan
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Allow first-run empty state only
        type: boolean
        default: false
      dry_run:
        description: Public market connectivity and scanner test without credentials or email
        type: boolean
        default: false
  schedule:
    - cron: "2,17,32,47 * * * *"
permissions:
  contents: read
  actions: write
concurrency:
  group: public-market-scan
  cancel-in-progress: false
jobs:
  run:
    if: vars.ENABLED == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
      SMTP_RECIPIENT: ${{ secrets.SMTP_RECIPIENT }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      STRATEGY_CAPITAL_USDT: ${{ secrets.STRATEGY_CAPITAL_USDT }}
      ALLOW_BOOTSTRAP: ${{ inputs.bootstrap && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python cloud_state.py restore
      - run: python cloud_state.py configure
      - id: scan
        run: python live_monitor.py
      - id: claim
        run: python cloud_state.py claim --kind market
      - run: python cloud_state.py save
      - id: checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}-00-claimed
          path: state.enc
          if-no-files-found: error
          retention-days: 7
      - run: python cloud_state.py send --kind market
      - id: finalsave
        if: always() && steps.claim.outcome == 'success'
        run: python cloud_state.py save
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.finalsave.outcome == 'success'
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}-99-final
          path: state.enc
          if-no-files-found: error
          retention-days: 7
      - if: success()
        run: python cloud_state.py prune
  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python live_monitor.py --top 8
